version: 2
updates:
  # "uv" (not "pip") so uv.lock is updated too; "pip" only bumped the
  # version ranges in pyproject.toml and left the lockfile stale.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Majors that currently break the Next.js lint/build; revisit when supported.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    # The Dockerfiles live here, not in the repo root.
    directories:
      - "/backend"
      - "/frontend"
    ignore:
      # Stay on Python 3.12 until the locked deps (chromadb, pymupdf, LangChain)
      # are upgraded and verified on a newer interpreter. Docker tags count
      # 3.12 -> 3.15 as a "minor" update, hence both types.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
