name: Dependabot Auto-Merge

# Runs after "CI Pipeline" finishes. workflow_run always uses main's copy of
# this file and checks out main, so no PR code ever runs with a write token.
# The merge rules live in .github/scripts/dependabot-merge.sh.
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Merge if patch/minor and CI passed
        run: |
          for pr in $PRS; do
            .github/scripts/dependabot-merge.sh "$pr"
          done
        env:
          PRS: ${{ join(github.event.workflow_run.pull_requests.*.number, ' ') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CO_AUTHOR: "matteoespo <matteoespositomarroccella@gmail.com>"
