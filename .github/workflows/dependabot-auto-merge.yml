name: Dependabot Auto-Merge

# Runs after "CI Pipeline" finishes. workflow_run always uses main's copy of
# this file and checks out main, so no PR code ever runs with a write token.
# The merge rules live in .github/scripts/dependabot-merge.sh.
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write  # to start CI on main after a merge

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Merge if patch/minor and CI passed
        run: |
          merged=0
          for pr in $PRS; do
            out=$(.github/scripts/dependabot-merge.sh "$pr")
            echo "$out"
            grep -q ": merged$" <<<"$out" && merged=1
          done
          # A GITHUB_TOKEN merge doesn't trigger CI on main, and the PR was tested
          # against an older main: run CI on the merged result explicitly.
          # (The dispatched run's event is workflow_dispatch, so it can't re-trigger this job.)
          if [ "$merged" = 1 ]; then gh workflow run ci.yml --ref main; fi
        env:
          PRS: ${{ join(github.event.workflow_run.pull_requests.*.number, ' ') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CO_AUTHOR: "matteoespo <matteoespositomarroccella@gmail.com>"
