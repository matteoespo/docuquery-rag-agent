name: Bulk Merge Open Dependabot PRs

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bulk-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Approve and Merge open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching open Dependabot PRs..."
          prs=$(gh pr list --author "dependabot[bot]" --state open --json number -q '.[].number')
          
          if [ -z "$prs" ]; then
            echo "No open Dependabot PRs found."
            exit 0
          fi
          
          echo "Found PRs: $prs"
          
          for pr in $prs; do
            echo "Processing PR #$pr"
            
            # Approve the PR (we ignore failure in case it's already approved)
            gh pr review "$pr" --approve || echo "Could not approve (maybe already approved)"
            
            # Attempt to merge the PR
            gh pr merge "$pr" --merge || echo "Failed to merge PR #$pr"
            
            # Sleep briefly to avoid hitting rate limits
            sleep 2
          done
          
          echo "Done processing all open Dependabot PRs."
