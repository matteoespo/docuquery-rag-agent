name: Bulk Merge Open Dependabot PRs

# Manual run: merges every open Dependabot PR that passes the same rules as
# auto-merge (patch/minor only, CI green, no workflow changes). Others are skipped.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write  # to start CI on main after merging

jobs:
  bulk-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Merge eligible Dependabot PRs
        run: |
          prs=$(gh pr list --author "app/dependabot" --state open --json number -q '.[].number')
          [ -z "$prs" ] && { echo "No open Dependabot PRs."; exit 0; }
          merged=0
          for pr in $prs; do
            out=$(.github/scripts/dependabot-merge.sh "$pr") || out="::warning::Failed to merge #$pr"
            echo "$out"
            grep -q ": merged$" <<<"$out" && merged=1
            sleep 2
          done
          # GITHUB_TOKEN merges don't trigger CI on main: run it on the merged result.
          if [ "$merged" = 1 ]; then gh workflow run ci.yml --ref main; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CO_AUTHOR: "matteoespo <matteoespositomarroccella@gmail.com>"
