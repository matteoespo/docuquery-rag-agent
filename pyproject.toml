[project]
name = "docuquery-rag-agent"
version = "0.1.0"
description = "Local agentic RAG over technical PDF documentation (FastAPI + LangGraph + Ollama)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.0,<2.0.0",
    "ddgs>=9.0.0,<10.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "langchain-chroma>=1.0.0,<2.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-ollama>=1.0.0,<2.0.0",
    "langchain-text-splitters>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langsmith>=0.9.0,<1.0.0",
    "pdfplumber>=0.11.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "pymupdf>=1.26.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "uvicorn>=0.29.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
]

[tool.setuptools]
packages = ["backend"]
